<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Santa Matcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <!-- Optional local config (create secret-config.js from secret-config.example.js) -->
  <script src="./secret-config.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

  // EmailJS credentials. You can either edit these defaults here OR create a local
  // `secret-config.js` (recommended) in the project root with `window.SECRET_CONFIG`.
  // See `secret-config.example.js` for the format.
  const _cfgFull = window.SECRET_CONFIG || null;
  const _cfg = (_cfgFull && _cfgFull.EMAILJS) || {};
  const EMAILJS_SERVICE_ID = _cfg.SERVICE_ID || '**';
  const EMAILJS_TEMPLATE_ID = _cfg.TEMPLATE_ID || '**';
  const EMAILJS_PUBLIC_KEY = _cfg.PUBLIC_KEY || '**';

  // Helpful runtime info for debugging missing/invalid local config
  const _secretConfigLoaded = Boolean(_cfg.SERVICE_ID && _cfg.TEMPLATE_ID && _cfg.PUBLIC_KEY);

    const App = () => {
      const [participants, setParticipants] = useState([]);
      const [matches, setMatches] = useState([]);
      const [fileError, setFileError] = useState('');
      const [emailStatus, setEmailStatus] = useState('');
      const [isLoading, setIsLoading] = useState(false);
  const [isEmailJsReady, setIsEmailJsReady] = useState(false);
  // Delay between sending each email in milliseconds. Default: from local config or 1000ms.
  const _initialDelay = (window.SECRET_CONFIG && window.SECRET_CONFIG.DEFAULT_SEND_DELAY_MS) || 1000;
  const [sendDelayMs, setSendDelayMs] = useState(_initialDelay);

      useEffect(() => {
        const isConfigSet = !(EMAILJS_TEMPLATE_ID.includes('YOUR_') || EMAILJS_PUBLIC_KEY.includes('YOUR_'));
        if (window.emailjs && !isEmailJsReady && isConfigSet) {
          try {
            window.emailjs.init(EMAILJS_PUBLIC_KEY);
            setIsEmailJsReady(true);
            console.log("EmailJS initialized successfully.");
          } catch (e) {
            console.error("Failed to initialize EmailJS:", e);
            setFileError("Error initializing EmailJS. Check your Public Key.");
          }
        }
      }, [isEmailJsReady]);

      const handleFileUpload = (e) => {
        setFileError('');
        setParticipants([]);
        setMatches([]);
        const file = e.target.files[0];
        if (!file) return;

        if (!window.XLSX) {
          setFileError('SheetJS not loaded. Try again.');
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });

            const newParticipants = json.slice(1).map(row => ({
              name: row[0]?.trim(),
              email: row[1]?.trim(),
            })).filter(p => p.name && p.email && p.email.includes('@'));

            if (newParticipants.length < 2) {
              setFileError('Need at least two valid participants.');
              setParticipants([]);
            } else {
              setParticipants(newParticipants);
              setFileError(`Success! Loaded ${newParticipants.length} participants.`);
            }
          } catch (error) {
            console.error("Error parsing file:", error);
            setFileError('Invalid file format. Use XLSX/CSV with Name and Email.');
            setParticipants([]);
          }
        };

        reader.readAsArrayBuffer(file);
      };

      const generateMatches = useCallback(() => {
        if (participants.length < 2) {
          setFileError('Need at least two participants.');
          setMatches([]);
          return;
        }

        const shuffled = [...participants].sort(() => Math.random() - 0.5);
        const newMatches = shuffled.map((santa, i) => {
          const recipient = shuffled[(i + 1) % shuffled.length];
          return {
            santaName: santa.name,
            santaEmail: santa.email,
            recipientName: recipient.name,
            status: 'Pending',
            showRecipient: false,
          };
        });

        setMatches(newMatches);
        setEmailStatus(`Generated ${newMatches.length} matches.`);
      }, [participants]);

      const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

      const sendAllEmails = async () => {
        const isConfigSet = !(EMAILJS_TEMPLATE_ID.includes('YOUR_') || EMAILJS_PUBLIC_KEY.includes('YOUR_'));
        if (!isConfigSet) {
          setEmailStatus('Error: EmailJS config missing.');
          return;
        }
        if (!isEmailJsReady) {
          setEmailStatus('Error: EmailJS not initialized.');
          return;
        }
        if (matches.length === 0) {
          setEmailStatus('Error: No matches to send.');
          return;
        }

        setIsLoading(true);
        setEmailStatus('Sending emails...');
        let successCount = 0;
        let failedCount = 0;

        // Send emails sequentially, waiting `sendDelayMs` between each send.
        const updatedMatches = [...matches];
        for (let i = 0; i < matches.length; i++) {
          const match = matches[i];
          const templateParams = {
            name: match.santaName,
            time: new Date().toLocaleString(),
            message: `Hi ${match.santaName}, You are the Secret Santa for ${match.recipientName}! Get ready to spread some holiday cheer 🎄🎁`,
            to_email: match.santaEmail,
          };

          try {
            // Some EmailJS setups require the public key to be passed as the 4th arg.
            // Passing it explicitly can resolve 400/Method Not Allowed errors from the API.
            const response = await window.emailjs.send(
              EMAILJS_SERVICE_ID,
              EMAILJS_TEMPLATE_ID,
              templateParams,
              EMAILJS_PUBLIC_KEY
            );

            if (response && response.status === 200) {
              successCount++;
              updatedMatches[i] = { ...updatedMatches[i], status: 'Sent' };
            } else {
              failedCount++;
              updatedMatches[i] = { ...updatedMatches[i], status: 'Failed' };
              console.error('EmailJS send failed, response:', response);
            }
          } catch (error) {
            failedCount++;
            updatedMatches[i] = { ...updatedMatches[i], status: 'Error' };
            console.error('EmailJS send error:', error);
            // Surface a short message in the UI for quick debugging
            setEmailStatus(`Send error for ${match.santaEmail}: ${error && error.text ? error.text : error.message || error}`);
          }

          // Update UI after each send so user sees progress
          setMatches([...updatedMatches]);

          // Wait between sends unless it's the last email
          if (i < matches.length - 1) {
            await sleep(Number(sendDelayMs) || 0);
          }
        }

        setIsLoading(false);
        setEmailStatus(`Emails sent: ${successCount}, Failed: ${failedCount}`);
      };

      const toggleRecipientVisibility = (index) => {
        setMatches(prev =>
            prev.map((match, i) =>
            i === index ? { ...match, showRecipient: !match.showRecipient } : match
            )
        );
        };

      return (
        <div className="min-h-screen bg-gray-50 p-4 sm:p-8 font-sans">
          <div className="max-w-4xl mx-auto">
            <header className="text-center mb-10 p-6 bg-white shadow-xl rounded-xl border-t-4 border-indigo-600">
              <h1 className="text-4xl font-extrabold text-indigo-700 mb-2">Secret Santa Matcher</h1>
              {!_secretConfigLoaded && (
                <p className="text-sm text-red-600 mt-1">Local config not loaded or missing keys — using placeholders. Create `secret-config.js` from `secret-config.example.js`.</p>
              )}
            </header>

            <section className="bg-white p-6 mb-6 rounded-xl shadow-lg border border-gray-200">
              <h2 className="text-2xl font-semibold text-gray-800 mb-4">1. Upload Participants</h2>
              <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFileUpload}
                className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
              {fileError && <p className={`mt-2 text-sm font-medium ${fileError.startsWith('Success') ? 'text-green-600' : 'text-red-600'}`}>{fileError}</p>}
            </section>

            <section className="bg-white p-6 mb-6 rounded-xl shadow-lg border border-gray-200">
              <h2 className="text-2xl font-semibold text-gray-800 mb-4">2. Generate Matches</h2>
              <p className="text-gray-600 mb-4">Participants: <span className="font-bold text-indigo-700">{participants.length}</span></p>
              <button onClick={generateMatches} disabled={participants.length < 2 || isLoading}
                className={`w-full sm:w-auto px-8 py-3 rounded-lg font-bold transition duration-200 shadow-lg ${participants.length < 2 || isLoading ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>
                {isLoading ? 'Processing...' : 'Generate Secret Santa Pairs'}
              </button>
            </section>

            <section className="bg-white p-6 mb-6 rounded-xl shadow-lg border border-gray-200">
              <h2 className="text-2xl font-semibold text-gray-800 mb-4">3. Send Emails</h2>
              {matches.length > 0 ? (
                <>
                  <p className="text-gray-600 mb-4">{matches.length} matches ready.</p>

                  <div className="mb-4 flex flex-col sm:flex-row sm:items-center sm:gap-4">
                    <label className="text-sm text-gray-700">Delay between emails (seconds):</label>
                    <input
                      type="number"
                      min="0"
                      step="0.1"
                      value={Number(sendDelayMs) / 1000}
                      onChange={(e) => setSendDelayMs(Math.max(0, Number(e.target.value || 0)) * 1000)}
                      className="mt-2 sm:mt-0 w-36 px-3 py-2 border rounded-md text-sm"
                    />
                    <p className="text-xs text-gray-500 mt-2 sm:mt-0">Set to 1 for ~1 second (default).</p>
                  </div>

                  <button onClick={sendAllEmails} disabled={isLoading || !isEmailJsReady || EMAILJS_PUBLIC_KEY.includes('YOUR_')}
                    className={`w-full sm:w-auto px-8 py-3 rounded-lg font-bold transition duration-200 shadow-lg
                      ${isLoading || !isEmailJsReady || EMAILJS_PUBLIC_KEY.includes('YOUR_')
                        ? 'bg-yellow-300 text-yellow-700 cursor-not-allowed'
                        : 'bg-green-600 hover:bg-green-700 text-white'}`}>
                    {isLoading ? 'Sending...' : 'Send All Secret Santa Emails'}
                  </button>
                </>
              ) : (
                <p className="text-yellow-600 font-medium">Generate matches in Step 2 first.</p>
              )}
              {emailStatus && (
                <p className="mt-4 text-sm font-semibold text-indigo-800 bg-indigo-100 p-3 rounded-md border border-indigo-300">{emailStatus}</p>
              )}
              <div className="mt-6 p-4 bg-gray-100 rounded-lg text-sm text-gray-600 border-l-4 border-indigo-500">
                <p className="font-semibold mb-2">Template Variables:</p>
                <p>Your EmailJS template must use these variables:</p>
                <code className="block p-2 mt-1 bg-white rounded border border-gray-300">
                  - <span className="text-red-500 font-bold">name</span><br />
                  - <span className="text-red-500 font-bold">time</span><br />
                  - <span className="text-red-500 font-bold">message</span><br />
                  - <span className="text-red-500 font-bold">to_email</span>
                </code>
              </div>
            </section>

            {/* Match Results Table */}
            {matches.length > 0 && (
              <section className="bg-white p-6 rounded-xl shadow-lg border border-gray-200 mt-6">
                <h2 className="text-2xl font-semibold text-gray-800 mb-4">Match Status Overview</h2>
                <div className="overflow-x-auto rounded-lg border border-gray-300">
                  <table className="min-w-full divide-y divide-gray-200">
                    <thead className="bg-gray-100">
                      <tr>
                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Secret Santa</th>
                        <th className="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Recipient</th>
                        <th className="px-6 py-3 text-center text-xs font-medium text-gray-700 uppercase tracking-wider">Email Status</th>
                      </tr>
                    </thead>
                    <tbody className="bg-white divide-y divide-gray-200">
                      {matches.map((match, index) => (
                        <tr key={index} className="hover:bg-indigo-50 transition-colors duration-150">
                          <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                            {match.santaName}
                            <span className="block text-xs text-gray-500 truncate">{match.santaEmail}</span>
                          </td>

                          <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold flex items-center gap-2">
                        {match.showRecipient ? match.recipientName : '••••••••••••'}
                        <button
                            onClick={() => toggleRecipientVisibility(index)}
                            className="text-indigo-600 hover:text-indigo-800 focus:outline-none"
                            title={match.showRecipient ? 'Hide recipient' : 'Show recipient'}
                        >
                            {match.showRecipient ? '🙈' : '👁️'}
                        </button>
                        </td>
                          <td className="px-6 py-4 whitespace-nowrap text-center">
                            <span className={`px-3 py-1 inline-flex text-xs leading-5 font-bold rounded-full
                              ${match.status === 'Sent' ? 'bg-green-200 text-green-900' :
                                match.status === 'Failed' || match.status === 'Error' ? 'bg-red-200 text-red-900' :
                                'bg-yellow-200 text-yellow-900'}`}>
                              {match.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
